<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <nav>
      <h1>Weather Appp</h1>
      <input type="text" placeholder="location" />
      <button>Search</button>
      <div sliderContainer>
        <span>°F</span>
        <label class="switch">
          <input type="checkbox" />
          <span class="slider round"></span>
        </label>
        <span>°C</span>
      </div>
    </nav>
    <main>
      <h2>las vegas</h2>
      <div stats>
        <div>
          <h3>Condition</h3>
          <p condition>Partially cloudy</p>
        </div>
        <div>
          <h3>Temperature</h3>
          <p temp>68.1 °F</p>
        </div>
      </div>
    </main>
  </body>
</html>
