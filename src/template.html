<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <h1>Weather App</h1>

    <div class="search-bar">
      <label for="location">Location:</label>
      <input type="text" id="location" />
      <button class="search-btn">Search</button>
    </div>

    <h2 class="city-name">Las Vegaas</h2>

    <main class="weather-main">
      <div class="current-weather">
        <div class="weather-icon-container">
          <img src="#" alt="Weather icon" class="weather-icon" />
        </div>
        <div class="temp-display">
          <span class="temp-value"></span>
          <span class="temp-unit active-unit">°F</span>
          <span class="separator">|</span>
          <span class="temp-unit">°C</span>
        </div>
        <div class="weather-stats">
          <p>Precipitation: <span class="precipitation-val"></span></p>
          <p>Humidity: <span class="humidity-val"></span></p>
          <p>Wind: <span class="wind-val"></span></p>
        </div>
      </div>

      <div class="weather-details">
        <p>Weather</p>
        <p class="condition-text">Partly Cloudy</p>
        <p class="time-text">Day - Time</p>
      </div>
    </main>

    <section class="forecast-days"></section>
  </body>
</html>
